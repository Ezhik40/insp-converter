workflows:
  android-apk-build:
    name: Android APK Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - android-signing
    triggering:
      events:
        - push
    scripts:
      - name: Recreate Flutter Android project structure
        script: |
          mv lib/main.dart ./main.dart.bak
          mv pubspec.yaml ./pubspec.yaml.bak
          flutter create . --platforms=android --org com.example --project-name=insp_converter --overwrite
          rm -f pubspec.yaml
          mv ./main.dart.bak lib/main.dart
          mv ./pubspec.yaml.bak pubspec.yaml
      - name: Force Inject Android 16 Permissions via Gradle
        script: |
          # Вместо sed мы прописываем жесткое правило сборки: Gradle сам добавит разрешения в манифест
          TARGET_FILE="android/app/build.gradle"
          if [ -f "$TARGET_FILE" ]; then
            echo -e "\nandroid { defaultConfig { manifestPlaceholders = [manifestApplicationId: \"com.example.insp_converter\"] } }" >> "$TARGET_FILE"
            
            # Создаем принудительный оверлей манифеста, который намертво вошьет разрешения в APK
            MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
            cat <<EOT > "$MANIFEST_FILE"
            <manifest xmlns:android="http://android.com" package="com.example.insp_converter">
                <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
                <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
                <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
                <application android:label="INSP Converter" android:icon="@mipmap/ic_launcher">
                    <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:hardwareAccelerated="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN"/>
                            <category android:name="android.intent.category.LAUNCHER"/>
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            EOT
            echo "Манифест с разрешениями для Android 16 успешно перезаписан!"
          fi
      - name: Inject Android 16 Signing Configs
        script: |
          TARGET_FILE="android/app/build.gradle"
          if [ -f "$TARGET_FILE" ]; then
            sed -i '/buildTypes {/i \    signingConfigs { debug { storeFile file("debug.keystore"); storePassword "android"; keyAlias "androidkey"; keyPassword "android" } }' "$TARGET_FILE"
            sed -i '/release {/a \            signingConfig signingConfigs.debug' "$TARGET_FILE"
            echo "Конфигурация подписи добавлена!"
          fi
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Flutter APK
        script: |
          flutter build apk --release --no-shrink --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
