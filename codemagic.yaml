workflows:
  android-apk-build:
    name: Android APK Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - android-signing
    triggering:
      events:
        - push
    scripts:
      - name: Recreate Flutter Android project structure
        script: |
          # Временно прячем наш правильный main.dart, чтобы flutter create его не стер
          mv lib/main.dart ./main.dart.bak
          
          # Пересоздаем структуру проекта
          flutter create . --platforms=android --overwrite
          
          # Возвращаем наш рабочий main.dart на место
          mv ./main.dart.bak lib/main.dart
            - name: Force Inject Android 16 Permissions and Queries via Gradle
        script: |
          TARGET_FILE="android/app/build.gradle"
          if [ -f "$TARGET_FILE" ]; then
            echo -e "\nandroid { defaultConfig { manifestPlaceholders = [manifestApplicationId: \"com.example.insp_converter\"] } }" >> "$TARGET_FILE"
            
            MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
            echo '<manifest xmlns:android="http://android.com" package="com.example.insp_converter">' > "$MANIFEST_FILE"
            # Декларируем системе Android 16, что наше приложение имеет право запрашивать запуск Termux
            echo '    <queries><package android:name="com.termux" /></queries>' >> "$MANIFEST_FILE"
            echo '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' >> "$MANIFEST_FILE"
            echo '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' >> "$MANIFEST_FILE"
            echo '    <application android:label="INSP Converter" android:icon="@mipmap/ic_launcher">' >> "$MANIFEST_FILE"
            echo '        <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:hardwareAccelerated="true">' >> "$MANIFEST_FILE"
            echo '            <intent-filter>' >> "$MANIFEST_FILE"
            echo '                <action android:name="android.intent.action.MAIN"/>' >> "$MANIFEST_FILE"
            echo '                <category android:name="android.intent.category.LAUNCHER"/>' >> "$MANIFEST_FILE"
            echo '            </intent-filter>' >> "$MANIFEST_FILE"
            echo '        </activity>' >> "$MANIFEST_FILE"
            echo '    </application>' >> "$MANIFEST_FILE"
            echo '</manifest>' >> "$MANIFEST_FILE"
            echo "Манифест успешно обновлен!"
          fi
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Flutter APK
        script: |
          flutter build apk --release --no-shrink --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
