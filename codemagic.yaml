workflows:
  android-apk-build:
    name: Android APK Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - android-signing
    triggering:
      events:
        - push
    scripts:
      - name: Recreate Pure Flutter Android project structure
        script: |
          # Временно прячем наши рабочие файлы, чтобы они не затерлись
          mv lib/main.dart ./main.dart.bak
          mv pubspec.yaml ./pubspec.yaml.bak
          
          # Начисто создаем современную структуру проекта под новый Flutter
          flutter create . --platforms=android --org com.ezhik --project-name=insta360_sbs_converter --overwrite
          
          # Возвращаем наши файлы на место
          rm -f pubspec.yaml
          mv ./main.dart.bak lib/main.dart
          mv ./pubspec.yaml.bak pubspec.yaml
      - name: Force Inject Android 16 Permissions and Queries via Gradle
        script: |
          TARGET_FILE="android/app/build.gradle"
          if [ -f "$TARGET_FILE" ]; then
            MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
            
            # Собираем чистый AndroidManifest, который жестко прописывает интент запуска Termux
            echo '<manifest xmlns:android="http://android.com" package="com.ezhik.insta360_sbs_converter">' > "$MANIFEST_FILE"
            echo '    <queries><package android:name="com.termux" /></queries>' >> "$MANIFEST_FILE"
            echo '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' >> "$MANIFEST_FILE"
            echo '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' >> "$MANIFEST_FILE"
            echo '    <application android:label="INSP Converter" android:icon="@mipmap/ic_launcher">' >> "$MANIFEST_FILE"
            echo '        <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:hardwareAccelerated="true">' >> "$MANIFEST_FILE"
            echo '            <intent-filter>' >> "$MANIFEST_FILE"
            echo '                <action android:name="android.intent.action.MAIN"/>' >> "$MANIFEST_FILE"
            echo '                <category android:name="android.intent.category.LAUNCHER"/>' >> "$MANIFEST_FILE"
            echo '            </intent-filter>' >> "$MANIFEST_FILE"
            echo '        </activity>' >> "$MANIFEST_FILE"
            echo '    </application>' >> "$MANIFEST_FILE"
            echo '</manifest>' >> "$MANIFEST_FILE"
            echo "Манифест успешно собран!"
          fi
      - name: Inject Android 16 Signing Configs
        script: |
          TARGET_FILE="android/app/build.gradle"
          if [ -f "$TARGET_FILE" ]; then
            sed -i '/buildTypes {/i \    signingConfigs { debug { storeFile file("debug.keystore"); storePassword "android"; keyAlias "androidkey"; keyPassword "android" } }' "$TARGET_FILE"
            sed -i '/release {/a \            signingConfig signingConfigs.debug' "$TARGET_FILE"
            echo "Конфигурация подписи добавлена!"
          fi
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Flutter APK
        script: |
          flutter build apk --release --no-shrink --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
