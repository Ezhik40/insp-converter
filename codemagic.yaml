workflows:
  android-apk-build:
    name: Android APK Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - android-signing
    triggering:
      events:
        - push
    scripts:
      - name: Recreate Flutter Android project structure
        script: |
          # Принудительно пересоздаем структуру проекта
          flutter create . --platforms=android --overwrite
      - name: Inject Android 16 Signing Configs
        script: |
          # Автоматически прописываем подпись в сгенерированный build.gradle перед сборкой
          TARGET_FILE="android/app/build.gradle"
          if [ -f "$TARGET_FILE" ]; then
            sed -i '/buildTypes {/i \    signingConfigs { debug { storeFile file("debug.keystore"); storePassword "android"; keyAlias "androidkey"; keyPassword "android" } }' "$TARGET_FILE"
            sed -i '/release {/a \            signingConfig signingConfigs.debug' "$TARGET_FILE"
            echo "Конфигурация подписи для Android 16 успешно добавлена!"
          fi
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Flutter APK
        script: |
          # Собираем подписанный релизный APK
          flutter build apk --release --no-shrink --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
