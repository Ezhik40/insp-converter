plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.insp_converter"
    compileSdk 35 // Для Android 16 возвращаем самый свежий SDK

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.insp_converter"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        ndk.abiFilters 'armeabi-v7a', 'arm64-v8a'
    }

    buildTypes {
        release {
            // Используем стандартную отладочную подпись для релиза,
            // чтобы Android 16 не блокировал установку «пустого» пакета
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
